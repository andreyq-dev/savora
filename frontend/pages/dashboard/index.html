<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Savora | Dashboard</title>
    <link rel="stylesheet" href="/styles/main.css">
    <link rel="stylesheet" href="/styles/components.css">
    <link rel="stylesheet" href="/styles/layout.css">
</head>
<body class="dashboard-layout theme-monks">
    <div class="dashboard-shell">
        <aside class="dashboard-sidebar">
            <a class="sidebar-brand" href="/" aria-label="Savora">
                <img src="/utils/logo.svg" alt="Savora logo" class="sidebar-logo">
                
            </a>
            <nav class="sidebar-nav" aria-label="Dashboard navigation">
                <a href="/pages/dashboard/overview.html" class="sidebar-link active">Dashboard</a>
                <a href="/pages/dashboard/clients.html" class="sidebar-link">Clients</a>
                <a href="/pages/dashboard/dishes.html" class="sidebar-link">Dishes</a>
                <a href="/pages/dashboard/menus.html" class="sidebar-link">Menus</a>
                <a href="/pages/dashboard/quotations.html" class="sidebar-link">Quotations</a>
                <a href="/pages/dashboard/appointments.html" class="sidebar-link">Appointments</a>
            </nav>
            <div class="sidebar-card">
                Keep your service premium—update menus weekly and highlight seasonal specials.
            </div>
        </aside>

        <div class="dashboard-main">
            <header class="dashboard-topbar">
                <h1 class="topbar-title">Dashboard</h1>
                <div class="topbar-actions">
                    <div class="topbar-search">
                        <svg viewBox="0 0 20 20" fill="currentColor">
                            <path d="M9 3.5a5.5 5.5 0 1 0 0 11 5.5 5.5 0 0 0 0-11ZM2 9a7 7 0 1 1 12.452 4.391l3.328 3.329a.75.75 0 1 1-1.06 1.06l-3.329-3.328A7 7 0 0 1 2 9Z" clip-rule="evenodd" fill-rule="evenodd"/>
                        </svg>
                        <input type="search" placeholder="Search..." aria-label="Search">
                    </div>
                    <div class="topbar-user">
                        <div class="user-menu">
                            <button class="user-menu-btn" id="user-menu-button" aria-haspopup="true" aria-expanded="false">
                                <img src="https://ui-avatars.com/api/?name=Chef+User&background=06d6a0&color=fff" alt="User avatar" class="user-avatar">
                                <span class="hide-mobile">Chef</span>
                            </button>
                            <div class="user-menu-dropdown" id="user-menu-dropdown">
                                <a href="#" id="logout-btn">Sign Out</a>
                            </div>
                        </div>
                    </div>
                </div>
            </header>

            <main class="dashboard-content">
                <div class="main-container">
                    <div class="page-header">
                        <h1 class="page-title">Dashboard</h1>
                        <p class="page-description">Welcome back. Choose a section to get started.</p>
                    </div>

                    <div class="card">
                        <div class="card-body">
                            <p style="margin: 0; color: var(--color-gray-600);">
                                Tip: Use the navigation to manage clients, dishes, and menus.
                            </p>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script type="module" src="/scripts/core/app.js"></script>
    <script type="module" src="/scripts/views/dashboard.js"></script>
</body>
</html>
